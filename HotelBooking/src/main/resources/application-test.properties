spring.application.name=HotelBooking

# MySQL Docker local
spring.datasource.url=jdbc:mysql://host.docker.internal:3306/hotel_bookings
spring.datasource.username=root
spring.datasource.password=tu_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
secreteJwtString=una-clave-secreta-larga-y-aleatoria-123456789abcdef

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@test.com
spring.mail.password=test_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Admin
hotel.admin.email=admin@test.com

# Twilio
twilio.account-sid=test_account_sid
twilio.auth-token=test_auth_token
twilio.sms-number=${TWILIO_SMS_NUMBER:}
twilio.whatsapp-number=${TWILIO_WHATSAPP_NUMBER:}

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Stripe
stripe.api.public.key=test_public_key
stripe.api.secret.key=sk_test_dummy_key_for_tests