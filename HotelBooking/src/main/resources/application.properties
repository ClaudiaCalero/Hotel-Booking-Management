spring.application.name=HotelBooking

server.port=${PORT:8080}

# Bd
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
secreteJwtString=${SECRETEJWTSTRING}

# Email
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Admin
hotel.admin.email=${HOTEL_ADMIN_EMAIL}

# Twilio
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.sms-number=${TWILIO_SMS_NUMBER:}
twilio.whatsapp-number=${TWILIO_WHATSAPP_NUMBER:}

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Stripe
stripe.api.public.key=${STRIPE_API_PUBLIC_KEY}
stripe.api.secret.key=${STRIPE_API_SECRET_KEY}

# URL pública
app.base-url=${APP_BASE_URL:http://localhost:3000}

# Timeouts SMTP
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Payments: true = the server verifies the payment with Stripe;
# false = demo mode (the frontend simulates the payment and the result it reports is trusted)
payments.verify-with-stripe=${PAYMENTS_VERIFY_WITH_STRIPE:false}
